<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coaster Tycoon 3D</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body inert>
<header class="command-desk">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">CT</span>
    <div>
      <strong>Coaster Tycoon <b>3D</b></strong>
      <small id="calendar">March · Year 1</small>
    </div>
  </div>
  <div class="time-controls" aria-label="Simulation speed">
    <button id="pause" title="Pause / resume (Space)" aria-label="Pause or resume">Ⅱ</button>
    <button data-speed="1" class="active" title="Normal speed (1×)">1×</button>
    <button data-speed="2" title="Fast speed (2×)">2×</button>
    <button data-speed="4" title="Turbo speed (4×)">4×</button>
  </div>
  <button id="park-toggle" class="park-open" title="Toggle park open / closed">Park open</button>
  <button id="finance" class="money" title="View park finances">
    <small>Park funds</small>
    <strong id="cash">—</strong>
  </button>
  <div class="desk-right">
    <span id="guest-count">0 guests</span>
    <button id="save" title="Save park to browser storage">
      <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><path d="M3 2 h7.5 l2.5 2.5 v9 h-10 z" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="5" y="2" width="4.5" height="3.5" fill="currentColor" fill-opacity="0.3"/><rect x="4.5" y="8" width="7" height="4.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      <span>Save park</span>
    </button>
    <button id="export" title="Export park to JSON file">
      <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><path d="M8 2 v8 m-3 -3 l3 3 l3 -3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 10 v3.5 h11 v-3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>Export</span>
    </button>
    <button id="import" title="Import park from JSON file">
      <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><path d="M8 10 v-8 m-3 3 l3 -3 l3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 10 v3.5 h11 v-3.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      <span>Import</span>
    </button>
    <button id="new" title="Start a fresh park">
      <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="8" y1="4.5" x2="8" y2="11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="4.5" y1="8" x2="11.5" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>New park</span>
    </button>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<nav class="tools" aria-label="Park tools">
  <button data-tool="inspect" class="active" title="Inspect rides, guests, and staff">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 10 L14.5 14.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="5" cy="5" r="1.2" fill="currentColor"/></svg>
    <span>Inspect</span>
  </button>
  <button data-tool="track" title="Construct and edit coasters">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M1.5 13 C4.5 13 6 10 9 7 C11.5 4.5 13.5 3.5 15 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M2.5 15 C5.5 15 7 12 10 9 C12.5 6.5 14.2 5.2 15.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="3" y1="12.5" x2="4" y2="15.5" stroke="currentColor" stroke-width="1.2"/><line x1="6.5" y1="9.5" x2="8" y2="12" stroke="currentColor" stroke-width="1.2"/><line x1="10.5" y1="5.5" x2="12" y2="8" stroke="currentColor" stroke-width="1.2"/><line x1="13.5" y1="3" x2="14.8" y2="5" stroke="currentColor" stroke-width="1.2"/></svg>
    <span>Coasters</span>
  </button>
  <button data-tool="path" title="Lay public and queue paths">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="7" y1="4.5" x2="9" y2="4.5" stroke="currentColor" stroke-width="1.2"/><line x1="4.5" y1="7" x2="4.5" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="11.5" y1="7" x2="11.5" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="7" y1="11.5" x2="9" y2="11.5" stroke="currentColor" stroke-width="1.2"/></svg>
    <span>Paths</span>
  </button>
  <button data-tool="facility" title="Place food, drinks and restrooms">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M1.5 7 L8 2.5 L14.5 7 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><line x1="5.5" y1="4.2" x2="5.5" y2="7" stroke="currentColor" stroke-width="1.2"/><line x1="10.5" y1="4.2" x2="10.5" y2="7" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="7" width="10" height="6.5" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="5.5" y="9" width="5" height="4.5" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
    <span>Shops & facilities</span>
  </button>
  <button data-tool="amenity" title="Place benches and litter bins">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><line x1="2" y1="5" x2="14" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="2" y1="7.5" x2="14" y2="7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M3 5 L3 11 L13 11 L13 5" fill="none" stroke="currentColor" stroke-width="1.2"/><line x1="3" y1="11" x2="1.5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="11" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="3" y1="9.5" x2="13" y2="9.5" stroke="currentColor" stroke-width="1.1"/></svg>
    <span>Benches & bins</span>
  </button>
  <button data-tool="staff" title="Hire mechanics and handymen">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M2.5 8 C2.5 4 4.5 2.5 8 2.5 C11.5 2.5 13.5 4 13.5 8 Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1 8.5 C4.5 7 11.5 7 15 8.5 L13.5 10.5 C10.5 9.5 5.5 9.5 2.5 10.5 Z" fill="currentColor"/><circle cx="8" cy="5.2" r="1.3" fill="currentColor"/></svg>
    <span>Staff</span>
  </button>
  <button data-tool="terrain" title="Shape landscape and water">
    <svg class="tool-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M1.5 13.5 L6 7 L10 10 L14.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1.5 13.5 L6 7 L10 10 L14.5 3.5 L14.5 13.5 Z" fill="currentColor" fill-opacity="0.25"/><line x1="1" y1="14" x2="15" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Land & water</span>
  </button>
  <button data-tool="scenery" title="Scenery and gardens"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 3 7h3l-4 5h5v3h2v-3h5l-4-5h3Z" fill="currentColor"/></svg><span>Scenery</span></button>
  <div class="tools-end">
    <button id="camera" title="Default park overview">
      <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2.8" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="11.5" cy="5.2" r="0.8" fill="currentColor"/></svg>
      <span>Overview</span>
    </button>
    <button id="close-camera" title="Close-up action view">
      <svg class="btn-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="10" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6.5" cy="6.5" r="1.5" fill="currentColor"/></svg>
      <span>Close view</span>
    </button>
    <span id="save-status">Development preview</span>
  </div>
</nav>
<main>
  <div id="viewport" tabindex="0" aria-label="3D park. Drag to orbit, right-drag to pan, scroll to zoom."></div>
  <div class="scene-label">
    <span class="live-dot" aria-hidden="true"></span>
    <strong>Copper Meadows</strong>
    <span id="scene-status">Opening park…</span>
  </div>
  <aside id="inspector" aria-labelledby="inspector-title">
    <div class="panel-heading">
      <span id="inspector-title">Park overview</span>
      <button id="clear-selection" title="Clear selection" aria-label="Clear selection">×</button>
    </div>
    <div id="inspection"></div>
  </aside>
  <div id="feedback" role="status" aria-live="polite">Loading your park…</div>
  <div class="camera-hint">Drag to orbit · Right-drag to pan · Scroll to zoom</div>
</main>
<footer class="construction-desk">
  <div class="mode-name">
    <small>BUILD & MANAGE</small>
    <strong id="tool-label">Park inspector</strong>
    <span id="tool-help">Select a ride, guest or staff member.</span>
  </div>
  <div id="palette"></div>
  <div class="placement-controls">
    <label for="height">Height <input id="height" type="number" min="0" max="256" step="8" value="32"></label>
    <label for="direction">Facing <select id="direction"><option value="0">East</option><option value="1">South</option><option value="2">West</option><option value="3">North</option></select></label>
    <span id="position">—</span>
  </div>
</footer>
<dialog id="finance-dialog">
  <form method="dialog">
    <button class="dialog-close" aria-label="Close finances">×</button>
    <h2>Park finances</h2>
    <div id="finance-summary"></div>
    <div class="loan-controls">
      <label for="loan">Loan principal <input id="loan" type="number" min="0" step="10"></label>
      <button id="set-loan" type="button">Set loan</button>
    </div>
    <p id="loan-feedback"></p>
    <button class="dialog-action-close">Close</button>
  </form>
</dialog>
<script type="module" src="game.js"></script>
</body>
</html>
